[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-peptide"
version = "1.2.0"
description = "List of papers about peptide research using deep learning"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Zhai Silong", email = "zhaisilong@outlook.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "python-liquid",
  "pandas",
  "tqdm",
  "fire",
]

[project.optional-dependencies]
dev = [
  "black",
  "build",
  "ipykernel",
]

[project.urls]
Homepage = "https://github.com/zhaisilong/awesome-peptide"
Repository = "https://github.com/zhaisilong/awesome-peptide"
Issues = "https://github.com/zhaisilong/awesome-peptide/issues"

[project.scripts]
awe-pep = "awepep.main:main"
awe-check = "awepep.check:main"

[tool.setuptools.packages.find]
include = ["awepep*"]

[tool.black]
target-version = ["py39"]
